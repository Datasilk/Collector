services:
  charlotte:
    # Playwright image — CefSharp is Windows-only, so containers must use
    # the playwright backend (CompositeBrowser falls back automatically).
    image: mcr.microsoft.com/playwright/dotnet:v1.64.0-jammy
    container_name: charlotte
    working_dir: /app
    volumes:
      - ../Charlotte:/app
    ports:
      - "7077:7077"
    environment:
      - ASPNETCORE_URLS=http://+:7077
      - DOTNET_RUNNING_IN_CONTAINER=true
    command: ["dotnet", "Charlotte.dll"]
    networks:
      - collector-net
    restart: unless-stopped

networks:
  collector-net:
    external: true
